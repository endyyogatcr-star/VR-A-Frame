<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>A-Frame VR</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/aframe/1.4.2/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      
      <!-- DAFTAR ASET -->
      <a-assets>
        <a-asset-item id="model3d" src="model.glb"></a-asset-item>
      </a-assets>

      <!-- KAMERA STATIS -->
      <!-- wasd-controls="enabled: false" mematikan tombol WASD & Panah secara total -->
      <a-camera 
        position="1.5 1 0" 
        look-controls="pointerLockEnabled: false" 
        wasd-controls="enabled: false">
      </a-camera>

      <!-- MODEL 3D -->
      <a-gltf-model 
        src="#model3d" 
        position="0 0 0" 
        scale="0.7 0.7 0.7">
      </a-gltf-model>

      <!-- LANTAI -->
      <a-plane 
        position="0 0 0" 
        rotation="-90 0 0" 
        width="20" 
        height="20" 
        color="#7BC8A4">
      </a-plane>

      <!-- LANGIT -->
      <a-sky color="#ECECEC"></a-sky>

    </a-scene>
  </body>
</html>
